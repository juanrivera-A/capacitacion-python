[project]
name = "fundamental-level"
version = "0.1.0"
description = ""
authors = [
    {name = "Juan Rivera Aguirre",email = "juan.rivera@axity.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic (>=2.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "tzdata (>=2026.4,<2027.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)"
]

[tool.poetry]
packages = [{include = "fundamental_level", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.mypy]
mypy_path = "."
explicit_package_bases = true


