[tool.poetry]
name = "advanced_level"
version = "0.1.0"
description = "Módulo de CLI y Automatización"
authors = ["Juan Rivera <juan.rivera@example.com>"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.142.1"
uvicorn = "^0.30.0"
sqlalchemy = "^2.0.0"
pydantic = "^2.8.0"
typer = ">=0.15.0,<0.28.0"
pydantic-settings = "^2.15.0"
rich = "^15.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-cov = "^5.0.0"
mypy = "^1.11.0"
ruff = "^0.6.0"
pip-audit = "^2.10.1"
safety = "^3.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poetry.scripts]
order-cli = "src.cli.main:app"